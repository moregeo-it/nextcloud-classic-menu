# SPDX-License-Identifier: AGPL-3.0-or-later
name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php-version }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: php -l
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 -P4 php -l

  javascript:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: node --check
        run: |
          for file in js/*.mjs l10n/*.js; do
            node --check "$file"
          done

  l10n:
    name: Translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Every source string has a translation entry
        run: node .github/scripts/check-l10n.mjs

  info-xml:
    name: appinfo/info.xml schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install xmllint
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libxml2-utils

      - name: Validate against the app store schema
        run: |
          curl -sSfL -o info.xsd https://apps.nextcloud.com/schema/apps/info.xsd
          xmllint --noout --schema info.xsd appinfo/info.xml
